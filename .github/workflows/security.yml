name: Security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 17 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.70.0
          TRIVY_SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
        run: |
          archive="$RUNNER_TEMP/trivy.tar.gz"
          install_dir="$RUNNER_TEMP/trivy"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Scan dependencies, secrets, and configuration
        run: |
          set -o pipefail
          trivy fs \
            --scanners vuln,secret,misconfig \
            --severity MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            --skip-dirs build \
            --skip-dirs submodules \
            . | tee trivy-report.txt

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-security-report
          path: trivy-report.txt
          if-no-files-found: warn
          retention-days: 14
